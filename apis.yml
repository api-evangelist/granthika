aid: granthika
name: Granthika
description: >-
  Granthika is a writing-software company founded by novelist Vikram Chandra
  (author of Sacred Games) and Borislav Iordanov. Its product is a first-of-its-kind
  semantic editor for professional and aspiring writers that lets authors capture
  and manage the knowledge inside a manuscript — characters, locations, events, and
  narrative structure — as they write, then integrate that knowledge back into the
  text. Features include universe/knowledge building, a timeline, semantic search,
  an intelligent analyzer, and language assistance, delivered as both an online app
  and a desktop application with free trials and educational subscriptions. Granthika
  was surfaced as a portfolio company of Bloomberg Beta. It publishes no bespoke
  developer/product API; its marketing site runs on Wix, which exposes a public Wix
  Site MCP endpoint and an llms.txt for agentic access to public site content.
